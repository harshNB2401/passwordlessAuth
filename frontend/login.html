<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Magic Link</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>
    <h1>Enter Your Magic Link Token</h1>
    <form id="magicLoginForm">
        <input type="text" id="token" placeholder="Enter Token" required>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("magicLoginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const token = document.getElementById("token").value;
        
            try {
                const response = await fetch(`http://localhost:3000/auth?token=${token}`);
                const result = await response.json();
        
                if (response.ok && result.success) {
                    document.getElementById("message").innerText = "✅ Login Successful! Redirecting...";
        
                    // ✅ Delay and Redirect to Dashboard
                    setTimeout(() => {
                        window.location.href = "http://localhost:3000/dashboard";
                    }, 1500);
                } else {
                    throw new Error(result.error || "Invalid token");
                }
            } catch (error) {
                document.getElementById("message").innerText = `❌ ${error.message}`;
            }
        });
        </script>
        
</body>
</html>
